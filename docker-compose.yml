services:
  postgres:
    image: postgres:16-alpine
    container_name: setu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_secret
      POSTGRES_DB: setu_db
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data

volumes:
  setu_pgdata:
